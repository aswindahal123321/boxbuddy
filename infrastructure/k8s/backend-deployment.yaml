apiVersion: apps/v1
kind: Deployment
metadata:
  name: freshplate-backend
  labels:
    app: freshplate-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: freshplate-backend
  template:
    metadata:
      labels:
        app: freshplate-backend
    spec:
      containers:
        - name: backend
          image: 776716168530.dkr.ecr.us-east-1.amazonaws.com/freshplate-backend:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 8080
          env:
            - name: PORT
              value: "8080"
            - name: USERS_TABLE
              value: "boxbuddy-users"
            - name: ORDERS_TABLE
              value: "boxbuddy-orders"
            - name: PRODUCTS_TABLE
              value: "boxbuddy-products"
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: freshplate-backend-secrets
                  key: jwtSecret
            - name: ADMIN_BYPASS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: freshplate-backend-secrets
                  key: adminBypassToken
            - name: ADMIN_BYPASS_EMAIL
              value: "admin@gmail.com"
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 20
